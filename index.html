<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Yaniv Consultancy Poll</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        YC
    </div>

    <div>
        <h1>Yaniv Consultancy</h1>
        <p>Public Poll</p>
    </div>

</header>


<main>

<section class="poll-card">

    <h2>Ward No 11</h2>

    <p class="question">
        Who is your preferred candidate?
    </p>


    <form id="pollForm">

        <label class="option">
            <input
                type="radio"
                name="poll"
                value="Lila Ram Ji"
                required>
            <span>Lilaram Ji</span>
        </label>


        <label class="option">
            <input
                type="radio"
                name="poll"
                value="Ramesh Ji">
            <span>Ramesh Ji</span>
        </label>


        <label class="option">
            <input
                type="radio"
                name="poll"
                value="Bhanwarlal Ji">
            <span>Bhanwarlal Ji</span>
        </label>


        <label class="option">
            <input
                type="radio"
                name="poll"
                value="Not to Any Above">
            <span>Not to Any Above</span>
        </label>


        <button type="submit">
            Submit Vote
        </button>

    </form>


    <div id="message"></div>


    <button
        class="result-btn"
        onclick="showResults()">
        View Results
    </button>


    <div id="results"></div>

</section>

</main>


<footer>

    <p>
        © 2026 Yaniv Consultancy
    </p>

    <p>
        This is an independent public poll.
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
